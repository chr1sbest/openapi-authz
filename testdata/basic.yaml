openapi: 3.0.0
info:
  title: Basic Auth Policy Test
  version: 1.0.0

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://example.com/oauth/authorize
          scopes:
            vegetable:write: write vegetables

paths:
  /public:
    get:
      summary: Public endpoint
      # no security -> public

  /user:
    get:
      summary: Any authenticated user
      security:
        - BearerAuth: []

  /admin:
    delete:
      summary: Admin-only operation
      security:
        - BearerAuth: []
      x-required-roles:
        - admin

  /scoped:
    post:
      summary: Scoped operation
      security:
        - OAuth2: ["vegetable:write"]
