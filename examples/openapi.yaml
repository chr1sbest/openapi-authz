openapi: 3.0.0
info:
  title: Example API
  version: 1.0.0
paths:
  /admin:
    get:
      summary: Admin only
      security:
        - BearerAuth: []
      x-required-roles:
        - admin
      responses:
        '200':
          description: OK
  /user:
    get:
      summary: Any authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
